<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>

    <style>
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .calc {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            width: 250px;
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 20px;
            margin-bottom: 10px;
            text-align: right;
            padding: 5px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 23%;
            height: 40px;
            margin: 1%;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .igual {
            background: #38bdf8;
        }

        .limpar {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>

<div class="calc">
    <input type="text" id="display" disabled>

    <div>
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('/')">÷</button>
    </div>

    <div>
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('*')">×</button>
    </div>

    <div>
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('-')">−</button>
    </div>

    <div>
        <button onclick="add('0')">0</button>
        <button onclick="limpar()" class="limpar">C</button>
        <button onclick="calcular()" class="igual">=</button>
        <button onclick="add('+')">+</button>
    </div>
</div>

<script>
    function add(valor) {
        document.getElementById("display").value += valor;
    }

    function limpar() {
        document.getElementById("display").value = "";
    }

    function calcular() {
        let resultado = eval(document.getElementById("display").value);
        document.getElementById("display").value = resultado;
    }
</script>

</body>
</html>
