<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site Pessoal</title>

    <style>
      <style>
    body {
        background: linear-gradient(135deg, #020617, #0f172a);
        color: white;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        padding: 50px;
    }

    .card {
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 20px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        transition: transform 0.3s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    img {
        width: 120px;
        border-radius: 50%;
        margin-bottom: 15px;
        border: 3px solid #38bdf8;
    }

    h1 {
        color: #38bdf8;
        margin-bottom: 10px;
    }

    p {
        color: #cbd5f5;
    }

    a {
        display: block;
        margin: 10px;
        padding: 12px;
        background: linear-gradient(45deg, #38bdf8, #0ea5e9);
        color: black;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s;
    }

    a:hover {
        transform: scale(1.05);
        background: linear-gradient(45deg, #0ea5e9, #0284c7);
    }
</style>
    </style>
</head>

<body>

    <div class="card">
        <img src="ney-carlos.jpeg" alt="Minha foto">

        <h1>Ney Carlos</h1>

        <p>Sou iniciante em programação 🚀<br>
        Estou aprendendo a criar sites!</p>

        <a href="#">https://www.instagram.com/ney.carloos/</a>
        <a href="#">Meu GitHub</a>
        <a href="#">Fale comigo</a>
    </div>

</body>
</html>
